name: finance-app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    volumes:
      # Source is bind-mounted for reload; the venv lives at /opt/venv so it survives.
      - ./packages/backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_IN_DOCKER: '1'
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./packages/frontend:/app
      # Anonymous volume keeps the container's linux node_modules from being
      # shadowed by the host's darwin build.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
