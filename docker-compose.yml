name: kp-app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kp}
      POSTGRES_DB: ${POSTGRES_DB:-kp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kp} -d ${POSTGRES_DB:-kp}']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      # The repo root is the context because the pnpm lockfile lives there.
      context: .
      dockerfile: apps/server/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kp}:${POSTGRES_PASSWORD:-kp}@db:5432/${POSTGRES_DB:-kp}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}"]'
      # The container always listens on 8000; the host port mapping below is
      # what FRONTEND_PORT/BACKEND_PORT actually change.
      BACKEND_PORT: 8000
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    volumes:
      - ./apps/server:/repo/apps/server
      # Anonymous volume keeps the container's node_modules from being shadowed
      # by the bind mount above.
      - /repo/apps/server/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      VITE_IN_DOCKER: '1'
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./apps/web:/repo/apps/web
      # Anonymous volume keeps the container's linux node_modules from being
      # shadowed by the host's darwin build.
      - /repo/apps/web/node_modules
    depends_on:
      server:
        condition: service_started

volumes:
  postgres-data:
